# Secret scan for every deevnet repository (CHG-0035).
#
# Each repository calls this from its own .github/workflows/secret-scan.yml:
#
#   jobs:
#     gitleaks:
#       uses: deevnet/.github/.github/workflows/secret-scan.yml@main
#       with:
#         blocking: false
#
# It scans the repository's whole history with gitleaks, using the shared
# gitleaks/gitleaks.toml from this repository unless the caller has its own
# .gitleaks.toml. Reviewed findings go in the caller's .gitleaksignore, by
# fingerprint (commit:file:rule:line, never the value).
#
# Findings are always redacted: these repositories are public, and so are
# their Actions logs.
name: Secret scan

on:
  workflow_call:
    inputs:
      blocking:
        description: Fail the check on any finding not in .gitleaksignore
        type: boolean
        default: false

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository, whole history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the shared config
        uses: actions/checkout@v4
        with:
          repository: deevnet/.github
          path: .deevnet-shared
          sparse-checkout: gitleaks

      - name: Install gitleaks
        run: |
          # Into the runner's temp dir, not the checkout: a repository may have
          # its own gitleaks/ (this one does).
          cd "$RUNNER_TEMP"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}" gitleaks
          ./gitleaks version
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan
        id: scan
        run: |
          config=.deevnet-shared/gitleaks/gitleaks.toml
          [ -f .gitleaks.toml ] && config=.gitleaks.toml
          echo "config: ${config}"
          set +e
          gitleaks git . --config "${config}" --redact=100 --no-banner \
            --report-format json --report-path gitleaks.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always()
        run: |
          n=$(jq length gitleaks.json 2>/dev/null || echo 0)
          {
            echo "## Secret scan: ${n} finding(s)"
            if [ "${n}" != "0" ]; then
              echo
              echo "Values are redacted. A reviewed false positive goes in \`.gitleaksignore\` by its fingerprint;"
              echo "a real one is rotated first, then ignored (history is not rewritten)."
              echo
              echo "| Rule | File | Line | Commit | Fingerprint |"
              echo "|---|---|---|---|---|"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:8]) | `\(.Fingerprint)` |"' gitleaks.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${n}" != "0" ]; then
            echo "::warning::gitleaks found ${n} unreviewed finding(s); see the job summary"
          fi

      - name: Enforce
        if: inputs.blocking && steps.scan.outputs.exit != '0'
        run: |
          echo "::error::Secret scan failed. See the job summary."
          exit 1
